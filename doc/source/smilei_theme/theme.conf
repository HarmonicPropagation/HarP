[theme]
inherit = basic
stylesheet = smilei_theme.css
pygments_style = sphinx

[options]
show_powered_by = true

main_color_bold = #8b27a5
main_color_med  = #C57FDD
main_color_pale = #F8EBFC
keyword_color = #3A1CBA

page_width = 210
head_height = 12
logo_height = 14

body_text = #3E4349
footer_text = #888

anchor = #DDD
anchor_hover_fg = #444
anchor_hover_bg = transparent

note_bg = #EEE
note_border = #CCC

seealso_bg = #EEE
seealso_border = #CCC

warn_bg = #FDE5FC
warn_border = #AD31CF

footnote_bg = #FDFDFD
footnote_border = #EEE

pre_bg = #EEE

code_font_size = 0.9em
code_font_family = 'Consolas', "BPmonoRound", 'Menlo', 'Deja Vu Sans Mono', 'Bitstream Vera Sans Mono', monospace
font_family = Avenir Next, sans-serif
head_font_family = "Avenir Next", sans-serif
